#--- Banco de Dados H2 em arquivo (pasta data/): os dados sobrevivem ao restart da aplicacao
#--- AUTO_SERVER=TRUE deixa outro programa (o Shell do H2) abrir o mesmo banco com a aplicacao rodando
spring.datasource.url=jdbc:h2:file:./data/tomada-vital-db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

#--- console do H2 no navegador, so no perfil dev
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
