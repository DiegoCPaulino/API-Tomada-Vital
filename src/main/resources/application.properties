spring.application.name=api-tomada-vital

#--- perfil padrao: dev (H2 em arquivo). O perfil docker (MySQL) e ligado pela variavel SPRING_PROFILES_ACTIVE
spring.profiles.active=dev

#--- JPA: o Hibernate cria/atualiza as tabelas a partir das entidades e mostra o SQL no log
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#--- Actuator: requisito 6 do enunciado (health, info e metrics)
management.endpoints.web.exposure.include=health,info,metrics
management.info.env.enabled=true
info.app.nome=API Tomada Vital
info.app.descricao=Fila de atendimento por tempo de bateria para pacientes eletrodependentes durante quedas de energia
info.app.versao=1.0.0
info.app.disciplina=Java Advanced - Global Solution 2026/2 - FIAP

#--- segredo do JWT: em dev usa o valor de exemplo; em producao vem da variavel JWT_SECRET
tomada-vital.jwt-secret=${JWT_SECRET:valor-de-desenvolvimento-troque-em-producao-32-bytes-ou-mais}
